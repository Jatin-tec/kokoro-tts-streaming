services:
  piper-tts:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: piper-tts-server
    ports:
      - "${HOST_PORT:-5001}:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - WORKERS=1
      - PIPER_MODEL=en_US-lessac-high
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
